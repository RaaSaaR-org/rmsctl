[package]
name = "rmsctl"
version = "0.1.0"
edition = "2024"
description = "CLI client for the NeoDEM robot management server"

[[bin]]
name = "rmsctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
